name: Deploy to All-Inkl

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Spiel-API und Kartenbilder zur Seite legen
        run: |
          mkdir -p dist/api
          cp api/index.php api/engine.php api/accounts.php api/.htaccess cards.json card-images.json dist/api/
          cp -r cardimages dist/cardimages

      - name: Datenbank-Zugang aus Secrets schreiben (nicht im Repository)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -n "$DB_NAME" ]; then
            php -r 'echo "<?php\nreturn " . var_export(["dsn" => "mysql:host=" . (getenv("DB_HOST") ?: "localhost") . ";dbname=" . getenv("DB_NAME") . ";charset=utf8mb4", "user" => getenv("DB_USER") ?: getenv("DB_NAME"), "password" => getenv("DB_PASSWORD")], true) . ";\n";' > dist/api/config.php
            echo "config.php geschrieben"
          else
            echo "Keine DB-Secrets gesetzt: Konten bleiben aus"
          fi

      - name: Upload via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get install -y lftp > /dev/null
          # Erst alles ausser den grossen Kartenbildern, dann die Bilder nur bei geaenderter Dateigroesse.
          lftp -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" -e "set ssl:verify-certificate no; set net:max-retries 3; set net:reconnect-interval-base 5; cd \"$FTP_DIR\"; lcd ./dist; mirror -R --verbose --exclude-glob cardimages/ . .; mirror -R --verbose --ignore-time cardimages cardimages; bye"
